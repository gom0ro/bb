<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Панель активности • История входов</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff5e7e'><path d='M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0c0e17;
      --bg-card: rgba(26, 29, 45, 0.85);
      --glass-border: rgba(255, 255, 255, 0.1);
      --primary: #ff5e7e;
      --secondary: #a855f7;
      --accent-gold: #ffb703;
      --tg-blue: #2aabee;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background-image: radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.15), transparent 70%);
    }

    .svg-icon {
      display: inline-block;
      vertical-align: -0.15em;
      width: 1.15em;
      height: 1.15em;
      fill: currentColor;
      flex-shrink: 0;
    }

    .hidden {
      display: none !important;
    }

    /* ---------------- AUTH LOCK SCREEN ---------------- */
    .lock-screen-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lock-card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      padding: 36px 26px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    .lock-icon-wrap {
      width: 68px;
      height: 68px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: rgba(255, 94, 126, 0.15);
      border: 1px solid rgba(255, 94, 126, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }

    .lock-icon-wrap svg {
      width: 32px;
      height: 32px;
    }

    .lock-card h1 {
      font-size: 1.45rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .lock-card p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .pin-display-wrap {
      margin-bottom: 20px;
    }

    .pin-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: var(--radius-md);
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--glass-border);
      color: #fff;
      font-size: 1.4rem;
      text-align: center;
      letter-spacing: 6px;
      font-weight: 700;
      outline: none;
      transition: border-color 0.2s;
    }

    .pin-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(255, 94, 126, 0.3);
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .key-btn {
      padding: 14px 0;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      color: white;
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .key-btn:active {
      transform: scale(0.95);
      background: rgba(255, 94, 126, 0.25);
    }

    .key-btn.action-btn {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .key-btn.submit-key {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
    }

    .lock-error-msg {
      color: #f87171;
      font-size: 0.88rem;
      margin-top: 10px;
      min-height: 20px;
    }

    .shake {
      animation: shakeAnim 0.4s ease;
    }

    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .back-to-site-link {
      display: inline-block;
      margin-top: 18px;
      color: var(--text-muted);
      font-size: 0.88rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-to-site-link:hover {
      color: white;
    }

    /* ---------------- DASHBOARD ---------------- */
    .dashboard-wrapper {
      max-width: 960px;
      margin: 0 auto;
      padding: 30px 20px 60px;
      width: 100%;
    }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--glass-border);
    }

    .dash-title-box h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .dash-title-box p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .dash-actions-top {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-dash {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: var(--radius-full);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.08);
      color: white;
      transition: all 0.2s;
    }

    .btn-dash:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--primary);
    }

    .btn-dash.btn-logout {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.3);
    }

    .btn-dash.btn-logout:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    /* Stats Overview */
    .dash-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 36px;
    }

    .dash-stat-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      border-radius: var(--radius-md);
      padding: 20px;
      text-align: center;
    }

    .dash-stat-num {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--accent-gold);
      margin-bottom: 4px;
    }

    .dash-stat-label {
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 500;
    }

    /* Sessions Log List */
    .sessions-section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sessions-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .session-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      border-radius: var(--radius-md);
      padding: 22px 24px;
      transition: border-color 0.2s;
    }

    .session-card:hover {
      border-color: rgba(255, 94, 126, 0.35);
    }

    .session-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
    }

    .session-time {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
    }

    .session-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-device {
      background: rgba(42, 171, 238, 0.18);
      color: var(--tg-blue);
      border: 1px solid rgba(42, 171, 238, 0.35);
    }

    .badge-os {
      background: rgba(168, 85, 247, 0.18);
      color: #d8b4fe;
      border: 1px solid rgba(168, 85, 247, 0.35);
    }

    .badge-screen {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .session-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .session-meta-item strong {
      color: var(--text-main);
    }

    .session-actions-timeline {
      background: rgba(0, 0, 0, 0.25);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
    }

    .timeline-title {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .action-tags-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .action-tag {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.84rem;
      color: #e2e8f0;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      color: var(--primary);
    }

    .bottom-controls-bar {
      margin-top: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    @media (max-width: 600px) {
      .dash-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .session-card {
        padding: 16px;
      }
      .dash-stats-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- AUTH LOCK SCREEN -->
  <div id="lock-screen" class="lock-screen-wrapper">
    <div class="lock-card">
      <div class="lock-icon-wrap">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      </div>
      <div class="pin-display-wrap">
        <input type="password" id="pin-input" class="pin-input" maxlength="6" placeholder="••••" readonly>
      </div>

      <div class="keypad-grid">
        <button class="key-btn" data-key="1">1</button>
        <button class="key-btn" data-key="2">2</button>
        <button class="key-btn" data-key="3">3</button>
        <button class="key-btn" data-key="4">4</button>
        <button class="key-btn" data-key="5">5</button>
        <button class="key-btn" data-key="6">6</button>
        <button class="key-btn" data-key="7">7</button>
        <button class="key-btn" data-key="8">8</button>
        <button class="key-btn" data-key="9">9</button>
        <button class="key-btn action-btn" id="key-clear">C</button>
        <button class="key-btn" data-key="0">0</button>
        <button class="key-btn submit-key" id="key-enter">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </button>
      </div>

      <div id="lock-error" class="lock-error-msg"></div>

      <div>
        <a href="index.html" class="back-to-site-link">
          <svg class="svg-icon" viewBox="0 0 24 24" style="margin-right: 4px;"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          Вернуться на главную страницу
        </a>
      </div>
    </div>
  </div>

  <!-- DASHBOARD WRAPPER -->
  <div id="dash-screen" class="dashboard-wrapper hidden">
    <header class="dash-header">
      <div class="dash-title-box">
        <h1>История входов и активности</h1>
        <p>Зафиксированные посещения сайта поздравления</p>
      </div>
      <div class="dash-actions-top">
        <a href="index.html" class="btn-dash">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          К поздравлению
        </a>
        <button id="logout-btn" class="btn-dash btn-logout">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
          Выйти
        </button>
      </div>
    </header>

    <!-- Stat boxes -->
    <div class="dash-stats-grid">
      <div class="dash-stat-card">
        <div class="dash-stat-num" id="stat-total-visits">0</div>
        <div class="dash-stat-label">Всего посещений</div>
      </div>
      <div class="dash-stat-card">
        <div class="dash-stat-num" id="stat-candles-blown">0</div>
        <div class="dash-stat-label">Задуваний свечей</div>
      </div>
      <div class="dash-stat-card">
        <div class="dash-stat-num" id="stat-tests-passed">0</div>
        <div class="dash-stat-label">Пройдено тестиков</div>
      </div>
      <div class="dash-stat-card">
        <div class="dash-stat-num" id="stat-letters-opened">0</div>
        <div class="dash-stat-label">Прочтений письма</div>
      </div>
    </div>

    <!-- Sessions Section -->
    <div class="sessions-section-title">
      <span>Журнал входов</span>
      <button id="refresh-btn" class="btn-dash" style="font-size: 0.8rem; padding: 6px 14px;">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        Обновить
      </button>
    </div>

    <div id="sessions-container" class="sessions-list">
      <!-- Populated via JS -->
    </div>

    <div class="bottom-controls-bar">
      <button id="clear-history-btn" class="btn-dash btn-logout">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        Очистить историю
      </button>
      <button id="clear-attempts-btn" class="btn-dash btn-logout">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        Очистить попытки
      </button>
      <button id="export-json-btn" class="btn-dash">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        Экспорт в JSON
      </button>
    </div>

    <!-- PIN Attempts Section -->
    <div class="sessions-section-title" style="margin-top: 36px;">
      <span>Попытки ввода кода</span>
    </div>
    <div id="attempts-container" class="sessions-list">
      <!-- Populated via JS -->
    </div>

  </div>

  <script>
    // --- PIN CODE SETTING ---
    // Секретный код для входа (19 лет, 23 октября)
    const SECRET_PIN = '2324';

    const lockScreen = document.getElementById('lock-screen');
    const dashScreen = document.getElementById('dash-screen');
    const pinInput = document.getElementById('pin-input');
    const errorMsg = document.getElementById('lock-error');
    const lockCard = document.querySelector('.lock-card');
    const logoutBtn = document.getElementById('logout-btn');
    const refreshBtn = document.getElementById('refresh-btn');
    const clearBtn = document.getElementById('clear-history-btn');
    const exportBtn = document.getElementById('export-json-btn');

    let currentEnteredPin = '';

    // Check if already authenticated in this session
    if (sessionStorage.getItem('admin_authenticated') === 'true') {
      unlockDashboard();
    }

    // Keypad event listeners
    document.querySelectorAll('.key-btn[data-key]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (currentEnteredPin.length < 6) {
          currentEnteredPin += btn.getAttribute('data-key');
          updatePinDisplay();
        }
      });
    });

    document.getElementById('key-clear').addEventListener('click', () => {
      currentEnteredPin = '';
      updatePinDisplay();
      errorMsg.textContent = '';
    });

    document.getElementById('key-enter').addEventListener('click', attemptUnlock);

    window.addEventListener('keydown', (e) => {
      if (!dashScreen.classList.contains('hidden')) return;
      if (e.key >= '0' && e.key <= '9') {
        if (currentEnteredPin.length < 6) {
          currentEnteredPin += e.key;
          updatePinDisplay();
        }
      } else if (e.key === 'Backspace') {
        currentEnteredPin = currentEnteredPin.slice(0, -1);
        updatePinDisplay();
      } else if (e.key === 'Enter') {
        attemptUnlock();
      }
    });

    function updatePinDisplay() {
      pinInput.value = currentEnteredPin;
    }

    const ATTEMPTS_KEY = 'yasmina_pin_attempts';

    function logPinAttempt(enteredPin, success) {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const time = `${pad(now.getDate())}.${pad(now.getMonth()+1)}.${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      const ua = navigator.userAgent;
      let device = /Mobi|Android|iPhone/i.test(ua) ? 'Телефон' : 'ПК';

      const attempts = JSON.parse(localStorage.getItem(ATTEMPTS_KEY) || '[]');
      attempts.unshift({ time, entered: enteredPin, success, device });
      if (attempts.length > 100) attempts.length = 100;
      localStorage.setItem(ATTEMPTS_KEY, JSON.stringify(attempts));
    }

    function attemptUnlock() {
      if (currentEnteredPin === SECRET_PIN) {
        logPinAttempt(currentEnteredPin, true);
        sessionStorage.setItem('admin_authenticated', 'true');
        unlockDashboard();
      } else {
        logPinAttempt(currentEnteredPin, false);
        errorMsg.textContent = 'Неверный код доступа';
        lockCard.classList.remove('shake');
        void lockCard.offsetWidth;
        lockCard.classList.add('shake');
        currentEnteredPin = '';
        updatePinDisplay();
      }
    }

    function unlockDashboard() {
      lockScreen.classList.add('hidden');
      dashScreen.classList.remove('hidden');
      renderDashboard();
      renderAttempts();
    }

    logoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem('admin_authenticated');
      dashScreen.classList.add('hidden');
      lockScreen.classList.remove('hidden');
      currentEnteredPin = '';
      updatePinDisplay();
      errorMsg.textContent = '';
    });

    refreshBtn.addEventListener('click', () => {
      renderDashboard();
      renderAttempts();
    });

    clearBtn.addEventListener('click', () => {
      if (confirm('Очистить всю историю посещений?')) {
        localStorage.removeItem('yasmina_site_logs');
        renderDashboard();
      }
    });

    document.getElementById('clear-attempts-btn').addEventListener('click', () => {
      if (confirm('Очистить все попытки ввода кода?')) {
        localStorage.removeItem('yasmina_pin_attempts');
        renderAttempts();
      }
    });

    exportBtn.addEventListener('click', () => {
      const logs = localStorage.getItem('yasmina_site_logs') || '[]';
      const blob = new Blob([logs], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `site_visits_${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    function renderAttempts() {
      const attempts = JSON.parse(localStorage.getItem('yasmina_pin_attempts') || '[]');
      const container = document.getElementById('attempts-container');
      if (!container) return;

      if (attempts.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <svg class="svg-icon" style="width: 36px; height: 36px;" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </div>
            <h3>Попыток ещё не было</h3>
            <p style="margin-top: 6px;">Здесь появятся все введённые коды при заходе на эту страницу.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      attempts.forEach((a, idx) => {
        const card = document.createElement('div');
        card.className = 'session-card';
        const isSuccess = a.success;
        const statusColor = isSuccess ? '#10b981' : '#ef4444';
        const statusText = isSuccess ? 'Верный код — вошла' : 'Неверный код';
        const maskedCode = a.entered
          ? (isSuccess ? '****' : a.entered.split('').map((d, i) => i < a.entered.length - 1 ? d : '*').join(''))
          : '(пусто)';

        card.innerHTML = `
          <div class="session-card-header">
            <div class="session-time">
              Попытка #${attempts.length - idx} &bull; ${a.time || 'Недавно'}
            </div>
            <div class="session-badges">
              <span class="badge badge-device">${a.device || 'Устройство'}</span>
              <span class="badge" style="background: ${isSuccess ? 'rgba(16,185,129,0.15)' : 'rgba(239,68,68,0.15)'}; color: ${statusColor}; border: 1px solid ${statusColor}40;">${statusText}</span>
            </div>
          </div>
          <div class="session-meta-grid">
            <div class="session-meta-item">
              <strong>Введено:</strong> <span style="font-family: monospace; letter-spacing: 3px; color: ${statusColor};">${maskedCode}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderDashboard() {
      const logs = JSON.parse(localStorage.getItem('yasmina_site_logs') || '[]');
      const container = document.getElementById('sessions-container');

      // Stats calculation
      let candlesCount = 0;
      let testsCount = 0;
      let lettersCount = 0;

      logs.forEach(s => {
        if (s.actions) {
          s.actions.forEach(a => {
            if (a.includes('свеч')) candlesCount++;
            if (a.includes('тест')) testsCount++;
            if (a.includes('письм')) lettersCount++;
          });
        }
      });

      document.getElementById('stat-total-visits').textContent = logs.length;
      document.getElementById('stat-candles-blown').textContent = candlesCount;
      document.getElementById('stat-tests-passed').textContent = testsCount;
      document.getElementById('stat-letters-opened').textContent = lettersCount;

      if (logs.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <svg class="svg-icon" style="width: 48px; height: 48px;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            </div>
            <h3>Пока нет записей о входах</h3>
            <p style="margin-top: 6px;">Когда сайт будет открыт, здесь появится подробная информация о времени, устройстве и действиях.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      logs.forEach((session, idx) => {
        const card = document.createElement('div');
        card.className = 'session-card';

        const actionTags = (session.actions && session.actions.length > 0)
          ? session.actions.map(act => `<span class="action-tag">${act}</span>`).join('')
          : '<span class="action-tag">Просмотр страницы</span>';

        card.innerHTML = `
          <div class="session-card-header">
            <div class="session-time">
              Визит #${logs.length - idx} • ${session.time || 'Недавно'}
            </div>
            <div class="session-badges">
              <span class="badge badge-device">${session.device || 'Устройство'}</span>
              <span class="badge badge-os">${session.os || 'ОС'}</span>
              <span class="badge badge-screen">${session.screen || 'Разрешение'}</span>
            </div>
          </div>
          <div class="session-meta-grid">
            <div class="session-meta-item">
              <strong>IP-адрес:</strong> ${session.ip || 'Определяется'}
            </div>
            <div class="session-meta-item">
              <strong>Браузер:</strong> ${session.browser || 'Мобильный/Веб'}
            </div>
          </div>
          <div class="session-actions-timeline">
            <div class="timeline-title">Хроника действий в этот визит:</div>
            <div class="action-tags-wrap">
              ${actionTags}
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
